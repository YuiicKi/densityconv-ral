# RDK S100 DensePillar CenterPoint compilation config
# Usage: hb_compile -c compile_rdk_s100.yaml

model_parameters:
  onnx_model: '/workspace/export/densepillar_centerpoint.onnx'
  march: "nash-e"
  working_dir: 'model_output'
  output_model_file_prefix: 'densepillar_centerpoint'

input_parameters:
  input_name: 'bev_features;bev_mask'
  input_shape: '1x32x1088x1088;1x1x1088x1088'
  input_type_rt: 'featuremap;featuremap'
  input_type_train: 'featuremap;featuremap'
  input_layout_train: 'NCHW;NCHW'
  norm_type: 'no_preprocess;no_preprocess'

calibration_parameters:
  cal_data_dir: '/workspace/export/calib_bev;/workspace/export/calib_mask'
  cal_data_type: 'float32;float32'
  calibration_type: 'default'

compiler_parameters:
  optimize_level: 'O2'
